name: Release

# Pushing a tag such as v0.1.0 builds and publishes the release.
# How to cut one: see "Cutting a release" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check the tag has release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
      - name: Test
        run: go vet ./... && go test -race ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token on RafaSG13/homebrew-tap with contents:write and pull_requests:write
          # (the formula arrives as a PR, main is protected); empty skips the formula.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # The attestation and the notes run whenever the archives were built, even if a later
      # GoReleaser step (the Homebrew PR) failed, so a tap problem cannot leave a release
      # without notes or provenance. The job still fails then, so the problem stays visible.
      # Signed provenance for every archive, verifiable with
      # `gh attestation verify <archive> --repo RafaSG13/Pandora`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        with:
          subject-checksums: dist/checksums.txt
      # Passing --release-notes to GoReleaser left the v0.1.0 body empty (its changelog
      # is disabled), so the notes are set explicitly after the release exists.
      - name: Publish release notes
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
