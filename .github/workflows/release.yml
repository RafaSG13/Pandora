name: Release

# Pushing a tag such as v0.1.0 builds and publishes the release.
# How to cut one: see "Cutting a release" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag has release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
      - name: Test
        run: go vet ./... && go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents:write on RafaSG13/homebrew-tap; empty skips the formula.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Passing --release-notes to GoReleaser left the v0.1.0 body empty (its changelog
      # is disabled), so the notes are set explicitly after the release exists.
      - name: Publish release notes
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
