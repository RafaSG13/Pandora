name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -race needs cgo, which the Windows runner has no C toolchain for.
      - name: Test (race detector)
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test ./...
      - run: go build ./cmd/pandora

  # Known vulnerabilities in the dependencies and the standard library that
  # this code reaches. The action checks the repository out itself.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  # Runs the store against a real Secret Service (gnome-keyring) in a throwaway
  # D-Bus session (see internal/store/integration_test.go).
  keyring-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install gnome-keyring
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Test against the real keyring
        run: |
          dbus-run-session -- sh -c '
            eval "$(printf "ci" | gnome-keyring-daemon --unlock --components=secrets)"
            PANDORA_INTEGRATION=1 go test -tags integration -run TestRealKeyring -v ./internal/store
          '

  # Dry run of the release build so a broken .goreleaser.yaml is caught in PRs.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_TOKEN: ""
